name: Reproducibility CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-reproduce:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Full Reproducibility Pipeline
      run: |
        python run_all_pipeline.py

    - name: Verify Generated Outputs & Figures
      run: |
        test -f data/survey_long_format.csv || exit 1
        test -f data/lmm_ready_data.csv || exit 1
        test -f figures/Figure_2_Interaction_Stage_Proficiency.png || exit 1
        test -f figures/Figure_3_Correlation_Editing_WritingScore.png || exit 1
        test -f figures/Figure_4_Strand_by_Stage_Distribution.png || exit 1
        test -f figures/Figure_5_WritingScore_Ceiling_Proficiency.png || exit 1
        echo "All data pipelines, statistical models, and figures reproduced successfully."
